<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>zii每日记录</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>🦋</text></svg>">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c9a0dc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>





















  <div class="layout">
    <!-- 左侧导航栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">🦋</span>
        <span class="brand-text">zii每日记录</span>
        <button class="sidebar-close-btn" onclick="toggleSidebarCollapse()" title="收起导航">✕</button>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item active" data-view="home" onclick="navTo('home')">
          <span class="nav-icon">🏠</span>
          <span>首页</span>
        </a>
        <a class="nav-item" data-view="dance" onclick="navTo('dance')">
          <span class="nav-icon">💃</span>
          <span>今天舞一下</span>
        </a>
        <a class="nav-item" data-view="mood" onclick="navTo('mood')">
          <span class="nav-icon">😊</span>
          <span>今日心情</span>
        </a>
        <a class="nav-item" data-view="moments" onclick="navTo('moments')">
          <span class="nav-icon">📸</span>
          <span>zii的朋友圈</span>
        </a>
        <a class="nav-item" data-view="diary" onclick="navTo('diary')">
          <span class="nav-icon">📝</span>
          <span>我的日记</span>
        </a>
        <a class="nav-item" data-view="schedule" onclick="navTo('schedule')">
          <span class="nav-icon">📅</span>
          <span>我的课表</span>
        </a>
        <div class="nav-divider"></div>
        <a class="nav-item" data-view="profile" onclick="navTo('profile')">
          <span class="nav-icon">👤</span>
          <span>个人中心</span>
        </a>
      </nav>
      <div class="sidebar-footer" id="sidebarFooter">
        <div class="user-avatar" id="sidebarAvatar">🦋</div>
        <div class="user-name" id="sidebarName">zii</div>
      </div>
    </aside>

    <!-- 右侧工作台 -->
    <main class="workspace">
      <!-- 侧边栏收起时的展开按钮 -->
      <button class="sidebar-expand-btn" onclick="toggleSidebarCollapse()" title="显示导航">☰</button>
      <!-- 移动端顶栏 -->
      <header class="mobile-header">
        <button class="menu-btn" onclick="toggleSidebarCollapse()">
          <span class="hamburger"></span>
        </button>
      </header>

      <!-- ========== 首页 ========== -->
      <section id="view-home" class="panel active">
        <div class="hero-card">
          <div class="hero-bg"></div>
          <div class="hero-content">
            <div class="hero-avatar" id="homeAvatar">🦋</div>
            <div class="hero-text">
              <p class="hero-greeting" id="homeGreeting">I AM? I AM!!</p>
            </div>
          </div>
        </div>
        <div class="stats-grid" id="statsGrid"></div>
        <div class="home-section">
          <h3>💃 最近舞蹈</h3>
          <div id="homeDance" class="home-list"></div>
        </div>
        <div class="home-section">
          <h3>😊 最近心情</h3>
          <div id="homeMood" class="home-list"></div>
        </div>
        <div class="home-section">
          <h3>📸 最近动态</h3>
          <div id="homeMoments" class="home-list"></div>
        </div>
        <div class="home-section">
          <h3>📝 最近日记</h3>
          <div id="homeDiary" class="home-list"></div>
        </div>
      </section>

      <!-- ========== 今天舞一下 ========== -->
      <section id="view-dance" class="panel">
        <div class="panel-header">
          <h2>💃 今天舞一下</h2>
          <button class="btn-primary" onclick="showDanceModal()">+ 记录舞蹈</button>
        </div>
        <div class="dance-cal">
          <button class="cal-toggle" onclick="toggleDanceCal()">📅 <span id="calToggleLabel">查看练舞日历</span></button>
          <div id="danceCalWrap" class="dance-cal-wrap hidden">
            <span class="cal-butterfly" style="top:38px; right:40%; transform:rotate(-20deg);">🦋</span>
            <span class="cal-butterfly" style="bottom:50px; right:12px; transform:rotate(25deg) scaleX(-1);">🦋</span>
            <span class="cal-butterfly" style="top:50%; left:8%; transform:rotate(-8deg);">🦋</span>
            <div class="cal-head">
              <button class="cal-arrow" onclick="shiftDanceCal(-1)">◀</button>
              <div class="cal-month" id="calMonthLabel"></div>
              <button class="cal-arrow" onclick="shiftDanceCal(1)">▶</button>
            </div>
            <div class="cal-weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
            <div class="cal-grid" id="calGrid"></div>
            <div class="cal-detail" id="calDetail"></div>
          </div>
        </div>
        <div class="style-tabs" id="styleTabs">
          <button class="style-tab active" data-style="all" onclick="filterDance('all')">全部</button>
          <button class="style-tab" data-style="爵士" onclick="filterDance('爵士')">🌸 爵士</button>
          <button class="style-tab" data-style="hiphop" onclick="filterDance('hiphop')">🔥 Hiphop</button>
          <button class="style-tab" data-style="编舞" onclick="filterDance('编舞')">🦋 编舞</button>
          <button class="style-tab" data-style="韩舞" onclick="filterDance('韩舞')">💜 韩舞</button>
        </div>
        <div id="danceList" class="card-list"></div>
      </section>

      <!-- ========== 今日心情 ========== -->
      <section id="view-mood" class="panel">
        <div class="panel-header">
          <h2>😊 今日心情</h2>
          <button class="btn-primary" onclick="showMoodModal()">+ 记录心情</button>
        </div>
        <div class="mood-quick-row">
          <button class="mood-btn" onclick="quickMood('开心','😄')">😄 开心</button>
          <button class="mood-btn" onclick="quickMood('平静','😌')">😌 平静</button>
          <button class="mood-btn" onclick="quickMood('疲惫','😮‍💨')">😮‍💨 疲惫</button>
          <button class="mood-btn" onclick="quickMood('焦虑','😣')">😣 焦虑</button>
          <button class="mood-btn" onclick="quickMood('难过','😢')">😢 难过</button>
        </div>
        <div id="moodList" class="card-list"></div>
      </section>

      <!-- ========== zii的朋友圈 ========== -->
      <section id="view-moments" class="panel">
        <div class="panel-header">
          <h2>📸 zii的朋友圈</h2>
          <button class="btn-primary" onclick="showMomentModal()">+ 发动态</button>
        </div>
        <div id="momentsList" class="card-list"></div>
      </section>

      <!-- ========== 我的日记 ========== -->
      <section id="view-diary" class="panel">
        <div class="panel-header">
          <h2>📝 我的日记</h2>
          <button class="btn-primary" onclick="showDiaryModal()">+ 写日记</button>
        </div>
        <div id="diaryList" class="card-list"></div>
      </section>

      <!-- ========== 我的课表 ========== -->
      <section id="view-schedule" class="panel">
        <div class="panel-header">
          <h2>📅 我的课表</h2>
          <div class="week-nav">
            <button onclick="changeWeek(-1)" class="btn-week">◀</button>
            <span id="weekLabel" class="week-label"></span>
            <button onclick="changeWeek(1)" class="btn-week">▶</button>
          </div>
        </div>
        <p class="schedule-sub" id="scheduleSub"></p>
        <div class="timetable-wrap">
          <table class="timetable" id="timetable">
            <thead>
              <tr>
                <th class="time-col">节次</th>
                <th>周一</th><th>周二</th><th>周三</th><th>周四</th><th>周五</th>
              </tr>
            </thead>
            <tbody id="timetableBody"></tbody>
          </table>
        </div>
      </section>

      <!-- ========== 个人中心 ========== -->
      <section id="view-profile" class="panel">
        <div class="panel-header">
          <h2>👤 个人中心</h2>
        </div>
        <div class="profile-card">
          <div class="profile-avatar-wrap">
            <img id="profileAvatar" src="" alt="头像" class="profile-avatar-img" style="display:none;">
            <div id="profileAvatarPlaceholder" class="profile-avatar-placeholder">🦋</div>
            <label class="avatar-upload-btn" id="avatarUploadBtn">
              📷 更换头像
              <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="uploadAvatar()">
            </label>
          </div>
          <div class="profile-fields">
            <label>昵称
              <input type="text" id="profileNickname" placeholder="输入昵称" maxlength="20">
            </label>
            <label>个人简介
              <textarea id="profileBio" rows="3" placeholder="介绍一下自己..." maxlength="500"></textarea>
            </label>
            <button class="btn-submit" id="profileSaveBtn" onclick="saveProfile()">💾 保存</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ========== 舞蹈弹窗 ========== -->
  <div id="danceModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🩰 新的舞蹈记录</h3>
        <button class="close-btn" onclick="hideModal('danceModal')">✕</button>
      </div>
      <form id="danceForm" class="modal-form" onsubmit="submitDance(event)">
        <label>舞蹈风格
          <select id="fStyle">
            <option value="">选择风格...</option>
            <option value="爵士">🌸 爵士</option>
            <option value="hiphop">🔥 Hiphop</option>
            <option value="编舞">🦋 编舞</option>
            <option value="韩舞">💜 韩舞</option>
          </select>
        </label>
        <label>标题 <span class="req">*</span>
          <input type="text" id="fTitle" placeholder="今天练了什么" maxlength="200" required>
        </label>
        <label>日期
          <input type="date" id="fDate">
        </label>
        <label>笔记
          <textarea id="fNote" rows="3" placeholder="心情、进步、待改进..."></textarea>
        </label>
        <div class="modal-label">视频 <span class="hint">≤1GB</span>
          <label class="upload-area" id="danceUploadArea">
            <span class="upload-icon">🎬</span>
            <span class="upload-text">点击选择视频</span>
            <input type="file" id="fVideo" accept="video/*">
          </label>
        </div>
        <button type="submit" class="btn-submit" id="danceSubmitBtn">✨ 保存</button>
      </form>
    </div>
  </div>

  <!-- ========== 心情弹窗 ========== -->
  <div id="moodModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>😊 记录心情</h3>
        <button class="close-btn" onclick="hideModal('moodModal')">✕</button>
      </div>
      <form id="moodForm" class="modal-form" onsubmit="submitMood(event)">
        <label>心情
          <div class="mood-select">
            <button type="button" class="mood-opt" data-mood="开心" data-emoji="😄" onclick="selectMood(this)">😄</button>
            <button type="button" class="mood-opt" data-mood="平静" data-emoji="😌" onclick="selectMood(this)">😌</button>
            <button type="button" class="mood-opt" data-mood="疲惫" data-emoji="😮‍💨" onclick="selectMood(this)">😮‍💨</button>
            <button type="button" class="mood-opt" data-mood="焦虑" data-emoji="😣" onclick="selectMood(this)">😣</button>
            <button type="button" class="mood-opt" data-mood="难过" data-emoji="😢" onclick="selectMood(this)">😢</button>
          </div>
          <input type="text" id="fMood" placeholder="或输入你的心情..." maxlength="20" oninput="onMoodInput(this.value)">
          <div class="emoji-pick">
            <span class="emoji-label">选个表情</span>
            <button type="button" class="emoji-opt" data-emoji="😄" onclick="selectEmoji(this)">😄</button>
            <button type="button" class="emoji-opt" data-emoji="😊" onclick="selectEmoji(this)">😊</button>
            <button type="button" class="emoji-opt" data-emoji="🥰" onclick="selectEmoji(this)">🥰</button>
            <button type="button" class="emoji-opt" data-emoji="😆" onclick="selectEmoji(this)">😆</button>
            <button type="button" class="emoji-opt" data-emoji="😌" onclick="selectEmoji(this)">😌</button>
            <button type="button" class="emoji-opt" data-emoji="🤔" onclick="selectEmoji(this)">🤔</button>
            <button type="button" class="emoji-opt" data-emoji="😎" onclick="selectEmoji(this)">😎</button>
            <button type="button" class="emoji-opt" data-emoji="🥳" onclick="selectEmoji(this)">🥳</button>
            <button type="button" class="emoji-opt" data-emoji="😮‍💨" onclick="selectEmoji(this)">😮‍💨</button>
            <button type="button" class="emoji-opt" data-emoji="😣" onclick="selectEmoji(this)">😣</button>
            <button type="button" class="emoji-opt" data-emoji="😢" onclick="selectEmoji(this)">😢</button>
            <button type="button" class="emoji-opt" data-emoji="😴" onclick="selectEmoji(this)">😴</button>
          </div>
          <input type="hidden" id="fMoodEmoji" value="😊">
        </label>
        <label>日期
          <input type="date" id="fMoodDate">
        </label>
        <label>想说的话
          <textarea id="fMoodNote" rows="3" placeholder="今天的心情是..."></textarea>
        </label>
        <button type="submit" class="btn-submit" id="moodSubmitBtn">✨ 保存</button>
      </form>
    </div>
  </div>

  <!-- ========== 朋友圈弹窗 ========== -->
  <div id="momentModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📸 发动态</h3>
        <button class="close-btn" onclick="hideModal('momentModal')">✕</button>
      </div>
      <form id="momentForm" class="modal-form" onsubmit="submitMoment(event)">
        <label>内容
          <textarea id="fMomentContent" rows="4" placeholder="分享一下此刻..."></textarea>
        </label>
        <div class="modal-label">图片 <span class="hint">最多9张</span>
          <label class="upload-area" id="momentUploadArea">
            <span class="upload-icon">🖼️</span>
            <span class="upload-text">点击选择图片</span>
            <input type="file" id="fMomentImages" accept="image/*,image/heic,image/heif" multiple onchange="previewImages(this)">
          </label>
        </div>
        <div id="imagePreview" class="image-preview"></div>
        <div class="modal-label">视频 <span class="hint">可选，≤1GB</span>
          <label class="upload-area" id="momentVideoArea">
            <span class="upload-icon">🎬</span>
            <span class="upload-text">点击选择视频</span>
            <input type="file" id="fMomentVideo" accept="video/*">
          </label>
        </div>
        <button type="submit" class="btn-submit" id="momentSubmitBtn">✨ 发布</button>
      </form>
    </div>
  </div>

  <!-- ========== 日记弹窗 ========== -->
  <div id="diaryModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📝 写日记</h3>
        <button class="close-btn" onclick="hideModal('diaryModal')">✕</button>
      </div>
      <form id="diaryForm" class="modal-form" onsubmit="submitDiary(event)">
        <label>标题
          <input type="text" id="fDiaryTitle" placeholder="今天的标题" maxlength="100">
        </label>
        <label>日期
          <input type="date" id="fDiaryDate">
        </label>
        <label>内容 <span class="req">*</span>
          <textarea id="fDiaryContent" rows="6" placeholder="今天发生了什么..." required></textarea>
        </label>
        <button type="submit" class="btn-submit" id="diarySubmitBtn">✨ 保存</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="db.js"></script>
  <script src="seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
